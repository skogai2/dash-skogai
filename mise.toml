# Runtimes for the shared workspace. Packages (gptme + gptme-contrib) are not
# listed: the launchers in bin/ install them on first run via uv. Build with
# admin/install-tools.sh; pins live in scripts/gen-bin.py.

[tools]
uv = "latest"
python = "latest"
"github:openknowledge-sh/openknowledge" = { version = "latest", exe = "openknowledge" }

[env]
_.path = ["{{config_root}}/bin"]
# who: CLAUDECODE=1 in everything Claude Code spawns (Bash tool, hooks, MCP servers, IDE terminals)
SKOGAI_USER = "{% if env.CLAUDECODE is defined %}claude{% else %}skogix{% endif %}"
# mode: CLAUDE_CODE_REMOTE is "true" in cloud sessions and never set locally
SKOGAI_MODE = "{% if env.CLAUDE_CODE_REMOTE is defined and env.CLAUDE_CODE_REMOTE == 'true' %}remote{% else %}workstation{% endif %}"

